<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Bài 3 - Kết Hợp Form và Dynamic Tabs</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Nav tabs -->
                <ul class="nav nav-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-bold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab" aria-controls="register" aria-selected="true">
                            Đăng ký
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab" aria-controls="login" aria-selected="false">
                            Đăng nhập
                        </button>
                    </li>
                </ul>

                <!-- Tab panes -->
                <div class="tab-content border border-top-0 bg-white p-4 rounded-bottom shadow-sm">
                    
                    <!-- Tab Đăng ký -->
                    <div id="register" class="tab-pane fade show active" role="tabpanel" aria-labelledby="register-tab">
                        <h4 class="fw-bold mb-4">Form Đăng Ký Thông Tin</h4>
                        <form>
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Họ và Tên</label>
                                <input type="text" class="form-control" placeholder="Nhập họ và tên" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Email</label>
                                <input type="email" class="form-control" placeholder="Nhập email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Số Điện Thoại</label>
                                <input type="tel" class="form-control" placeholder="Nhập số điện thoại" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Mật Khẩu</label>
                                <input type="password" class="form-control" placeholder="Nhập mật khẩu" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Xác Nhận Mật Khẩu</label>
                                <input type="password" class="form-control" placeholder="Xác nhận mật khẩu" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small me-3">Giới Tính:</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gioiTinhTab" id="maleTab" value="nam" checked>
                                    <label class="form-check-label small" for="maleTab">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gioiTinhTab" id="femaleTab" value="nu">
                                    <label class="form-check-label small" for="femaleTab">Nữ</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Ngôn Ngữ</label>
                                <select class="form-select">
                                    <option selected>Tiếng Việt</option>
                                    <option value="en">Tiếng Anh</option>
                                    <option value="jp">Tiếng Nhật</option>
                                </select>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="agreeTab" required>
                                <label class="form-check-label text-secondary small" for="agreeTab">
                                    Tôi đồng ý với các điều khoản và điều kiện
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary px-4">Đăng Ký</button>
                        </form>
                    </div>

                    <!-- Tab Đăng nhập -->
                    <div id="login" class="tab-pane fade" role="tabpanel" aria-labelledby="login-tab">
                        <h4 class="fw-bold mb-4">Form Đăng nhập</h4>
                        <form>
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Email</label>
                                <input type="email" class="form-control" placeholder="Nhập email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-secondary small">Mật Khẩu</label>
                                <input type="password" class="form-control" placeholder="Nhập mật khẩu" required>
                            </div>

                            <button type="submit" class="btn btn-primary px-4 mt-2">Đăng Nhập</button>
                        </form>
                    </div>

                </div>

            </div>
        </div>
    </div>
</body>
</html>
